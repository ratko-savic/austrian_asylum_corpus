# Acts recognised in provision citations (stage 06). How the chains before them are read:
# src/asylum_corpus/citations/statutes.py.
#
# A provision citation is a chain of designations ("§ 3 Abs. 1 und § 8 Abs. 1") followed by an act named here
# (`aliases`, as printed, case-sensitive); `act` is the normalized name used in `normalized` ("AsylG 2005 § 3 Abs. 1"),
# `type` the citation type of the schema. An alias belongs to one act only; the longest alias wins. A misspelling
# (`misspelling: true`) is an alias of the act it names; the citation's text stays verbatim.
#
# The first block lists the acts of asylum, aliens and procedural law, the constitution and other national acts the
# decisions apply, the ECHR, the EU treaties and asylum acts, and the GFK and KRK. The others are acts cited after a
# provision in at least 100 decisions (`decisions`: the BVwG decisions of the corpus in which one of the entry's aliases
# is the cited act of a provision citation, counted on the output of stage 06), or acts needed to read another
# correctly: with "AsylG 1997" and "AsylG 1991", "§ 7 AsylG 1997" is not read as "AsylG § 7". "AsylG" without a year
# stays "AsylG": both the AsylG 1997 and the AsylG 2005 apply in the period; likewise "FrG" (Fremdengesetz 1992 or
# 1997). The last block adds full titles and other spellings of these acts, and two acts named only so, by the same
# threshold.

# Every alias is also matched in the spelling with a capital "I" printed for a lower-case "l" ("§ 35 AsyIG 2005"), as
# a misspelling of the same act (one "l" per variant; a variant that is itself an alias, or that two acts would share,
# is left out). Generated, not listed: the confusion is typographic and the same for every alias.
capital_i_for_l: true

