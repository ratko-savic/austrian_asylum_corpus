# The appellant's gender, from the court's gendered wording. One appellant: the weighted cues of the head and the case
# history (articles, nouns and pronouns, after Ecker, Ennser-Jedenastik and Haselmayer 2020, Sex Roles 82:117-126); a
# gender needs a total weight of min_score and a share of min_share. Several appellants: each numbered person by the
# head's numbered list with its article ("1. der XXXX", weight min_score), the ordinal nouns ("Zweitbeschwerdeführerin")
# and the numbered abbreviations ("die BF2"), with the same thresholds per person; the decision is female / male when
# every appellant has that gender, mixed when both occur, else unknown.
appellant_gender:
  sections: [subject, operative_part, procedural_history, procedural_history_and_findings, findings, evidence_assessment]
  min_score: 3
  min_share: 0.8
  # One appellant is decided by the cues of whole words (the nouns with an article: "der Antrag der
  # Beschwerdeführerin", "vom Beschwerdeführer") where these decide, before the abbreviations ("des BF" is written of
  # women too); where every cue found in the parts above points one way, one_sided_min_score is enough (not in the
  # whole reasoning, whose legal assessment speaks of "den Beschwerdeführer" in general: "Eine Zurückziehung der
  # Beschwerde durch den Beschwerdeführer ist in jeder Lage des Verfahrens …"). Where the parts above do not decide (too
  # few cues: short decisions without a procedural history), the cues of the whole reasoning decide, with the same
  # thresholds.
  full_word_cues: [head_genitive_female, female_national, appellant_female, head_genitive_male, male_national,
                   appellant_male, appellant_male_nominative]
  one_sided_min_score: 1
  cues:
    female:
      - id: head_genitive_female
        weight: 3
        reason: the head names the appellant with the feminine genitive article - the most reliable cue
        pattern: '\b[Bb]eschwerde der (?:(?:mj\.?|minderjährigen|mündigen|unmündigen)\s+)?(?:Frau\s+)?(?:XXXX|[A-ZÄÖÜ]{2,})'
      - id: female_national
        weight: 3
        reason: '"eine weibliche Staatsangehörige"; the apposition or predicate "die Beschwerdeführerin, eine afghanische Staatsangehörige" / "die BF ist eine ... Staatsangehörige" (not after "Partei", whose gender is grammatical; not an object: "heiratete eine ... Staatsangehörige")'
        pattern: '\b(?:eine|die)\s+weibliche\s+Staatsangehörige\b|\b(?:BF|Beschwerdeführerin|Asylwerberin|Antragstellerin)\b(?:\s*\([^)]{0,60}\))?(?:\s*,\s*|\s+ist\s+)eine\s+(?:\w+\s+){0,2}?Staatsangehörige\b(?![rn])'
      - id: appellant_female
        weight: 1
        reason: the feminine singular noun; the plural "Beschwerdeführerinnen" does not match
        pattern: '\bBeschwerdeführerin\b'
      - id: appellant_female_abbrev
        weight: 1
        reason: feminine abbreviation used by some departments
        pattern: '\bBFin\b'
      - id: applicant_female
        weight: 1
        reason: the feminine nouns for asylum seeker and applicant
        pattern: '\b(?:Asylwerberin|Antragstellerin)\b'
      - id: appellant_abbrev_female
        weight: 1
        reason: with one appellant "die BF" is the feminine singular (the plural reading needs several appellants)
        pattern: '\b[Dd]ie BF\b(?!\s?\d)'
      - id: spouse_of_female
        weight: 0.5
        reason: 'a feminine possessive with her husband; half weight: in a husband''s case the text quotes his wife about "ihren Mann"'
        pattern: '\b(?:[Ii]hr(?:em|en|es)?|[Ii]hre[nmrs]?) (?:Ehemann(?:es)?|Ehegatten?|Mann(?:es)?|Gatten?)\b'
    male:
      - id: head_genitive_male
        weight: 3
        reason: the head names the appellant with the masculine genitive article
        pattern: '\b[Bb]eschwerde des (?:(?:mj\.?|minderjährigen|mündigen|unmündigen)\s+)?(?:Herrn\s+)?(?:XXXX|[A-ZÄÖÜ]{2,})'
      - id: male_national
        weight: 3
        reason: '"ein männlicher Staatsangehöriger"; the apposition or predicate "der Beschwerdeführer, ein afghanischer Staatsangehöriger" / "der BF ist ein ... Staatsangehöriger"'
        pattern: '\b(?:ein|der)\s+männliche[rn]?\s+Staatsangehörige[rn]?\b|\b(?:BF|Beschwerdeführer|Asylwerber|Antragsteller)\b(?:\s*\([^)]{0,60}\))?(?:\s*,\s*|\s+ist\s+)ein\s+(?:\w+\s+){0,2}?Staatsangehöriger\b'
      - id: appellant_male
        weight: 1
        reason: masculine singular forms with an article that is not also plural (des, dem, den without -n)
        pattern: '\b(?:des Beschwerdeführers|dem Beschwerdeführer|den Beschwerdeführer|vom Beschwerdeführer|beim Beschwerdeführer|zum Beschwerdeführer)\b'
      - id: appellant_male_nominative
        weight: 1
        reason: '"der Beschwerdeführer" is nominative singular masculine, rarely genitive plural with one appellant'
        pattern: '\b[Dd]er Beschwerdeführer\b(?! und)'
      - id: appellant_male_abbrev
        weight: 1
        reason: abbreviation with a masculine article (des / dem BF)
        pattern: '\b(?:des|dem) BF\b(?!\s?\d)'
      - id: appellant_abbrev_male_nominative
        weight: 1
        reason: '"Der BF" opening a sentence is the masculine nominative ("der BF" inside a sentence can be the feminine dative or genitive)'
        pattern: '\bDer BF\b(?!\s?\d)'
      - id: appellant_abbrev_male_accusative
        weight: 1
        reason: '"den BF" is the masculine accusative (with one appellant not the dative plural)'
        pattern: '\bden BF\b(?!\s?\d)'
      - id: applicant_male
        weight: 1
        reason: masculine forms of asylum seeker and applicant with an article; not "der Asylwerber", the genitive plural of country reports and the law ("Unterbringung der Asylwerber")
        pattern: '\b(?:des Asylwerbers|dem Asylwerber|des Antragstellers|dem Antragsteller)\b'
      - id: spouse_of_male
        weight: 0.5
        reason: a masculine possessive with his wife; half weight, as for spouse_of_female
        pattern: '\b(?:[Ss]ein(?:e|er|em|en)?) (?:Ehefrau|Ehegattin|Frau|Gattin)\b'
  # several appellants: the numbered persons of the head ("1.) der XXXX", "2. des mj. XXXX", "1.) Herrn XXXX , 2.) Frau
  # XXXX")
  head_person: '(?:^|[\s,;])\(?(?P<n3>\d{1,2})\s?\.?\s?\)\s*(?P<title3>Herrn?|Frau)\s+XXXX|(?:^|[\s,;])(?:\(?(?P<n>\d{1,2})\s?\.?\s?\))\s*(?P<article>des|der)\s+(?:(?:mj\.?|minderjährigen|mündigen|unmündigen|mdj\.?)\s+)?(?:XXXX|[A-ZÄÖÜ])|(?:^|[\s,;])(?P<n2>\d{1,2})\.\s+(?P<article2>des|der)\s+(?:(?:mj\.?|minderjährigen|mündigen|unmündigen|mdj\.?)\s+)?(?:XXXX|[A-ZÄÖÜ])'
  # the ordinal nouns are singular and gendered, so one is decisive
  ordinal_weight: 3
  # the numbered abbreviations with an article are decisive too ("die BF1", "des BF2")
  person_cue_weight: 3
  # unnumbered persons of the head, in their order ("Beschwerden des XXXX, der XXXX und des mj. XXXX"), in every block
  # of a head repeated per appellant
  head_person_unnumbered: '(?:^|[\s,;(])(?P<article>des|der)\s+(?:(?:mj\.?|minderjährigen|mündigen|unmündigen|mdj\.?)\s+)?(?:Herrn\s+|Frau\s+)?XXXX'
  # a head block (as in config/head/bvwg_head.yaml, appellants.block)
  head_block: 'Das\s+Bundesverwaltungsgericht\s+(?:hat|erkennt|beschließt|beschliesst)\b'
  # the ordinal noun ("Zweitbeschwerdeführerin"), also as a word ("die fünfte Beschwerdeführerin", "des zweiten
  # Beschwerdeführers"): female with "-in", male with the genitive "-s", the compound without ending ("dem
  # Zweitbeschwerdeführer") or the nominative "der zweite Beschwerdeführer"; not after "bis" ("Zweit- bis
  # Fünftbeschwerdeführer" is a plural range)
  ordinal: '(?<!bis\s)\b(?P<ord>Erst|Zweit|Dritt|Viert|Fünft|Sechst|Siebent|Siebt|Acht|Neunt|Zehnt|Elft|Zwölft)[- ]?[Bb]eschwerdeführer(?:(?P<f>in)\b|s\b|\b)|\b(?P<ord2>erste|zweite|dritte|vierte|fünfte|sechste|siebente|siebte|achte|neunte|zehnte)(?P<n2end>n|r)?\s+Beschwerdeführer(?:(?P<f2>in)\b|(?P<m2>s)\b|\b)'
  # the numbered abbreviations with an article ("die BF2" feminine; "des / dem / den BF1" and "Der BF1" opening a
  # sentence masculine; also with "mj." between: "den mj. BF 2"), and "Die männliche bP1 und weibliche bP2"; not in a
  # list ("die BF1 und BF2", "die BF1 und 2"); a next item with its own article is a person of its own ("den mj. BF 2,
  # den mj. BF 3")
  person_cues:
    - id: person_male_adjective
      gender: male
      pattern: '\bmännliche[rn]?\s+(?:bP|BF)\s?(?P<n>\d{1,2})\b'
    - id: person_female_adjective
      gender: female
      pattern: '\bweibliche[rn]?\s+(?:bP|BF)\s?(?P<n>\d{1,2})\b'
    - id: person_abbrev_female
      gender: female
      pattern: '\b[Dd]ie\s+(?:mj\.?\s+|minderjährige\s+)?BF\s?(?P<n>\d{1,2})\b(?!\s*(?:,|und|bis|sowie|-|/)\s*(?:(?:mj\.?\s+)?BF|\d))'
    - id: person_abbrev_male
      gender: male
      pattern: '\b(?:des|dem|den|Der)\s+(?:mj\.?\s+|minderjährigen\s+)?BF\s?(?P<n>\d{1,2})\b(?!\s*(?:,|und|bis|sowie|-|/)\s*(?:(?:mj\.?\s+)?BF|\d))'
  ordinals: {erst: 1, zweit: 2, dritt: 3, viert: 4, fünft: 5, sechst: 6, siebent: 7, siebt: 7, acht: 8, neunt: 9,
             zehnt: 10, elft: 11, zwölft: 12}
